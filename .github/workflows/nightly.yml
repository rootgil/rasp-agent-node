name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC every day
  workflow_dispatch:       # manual trigger

jobs:
  e2e-and-stress:
    name: "E2E + Stress (Node 22)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: E2E — banking-api
        run: npm run test:e2e
        env:
          NODE_ENV: test

      - name: Stress / crash tests
        run: npm run test:stress
        env:
          NODE_ENV: test

  benchmark:
    name: "Perf benchmark (k6)"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | \
            sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Install dependencies
        run: npm ci

      - name: Build banking-api (baseline — no RASP)
        run: |
          cd examples/banking-api
          npm ci

      - name: Start baseline server (port 3001, no agent)
        run: |
          NODE_ENV=test RASP_ENABLED=false PORT=3001 \
          node --import tsx/esm \
            examples/banking-api/src/server.ts &
          sleep 3

      - name: Run baseline benchmark
        run: |
          mkdir -p benchmarks/output
          k6 run benchmarks/k6/baseline.js \
            --env BASE_URL=http://127.0.0.1:3001

      - name: Start banking-api WITH agent (port 3000)
        run: |
          NODE_ENV=test RASP_MODE=monitor PORT=3000 \
          node --import tsx/esm \
            examples/banking-api/src/server.ts &
          sleep 3

      - name: Run with-agent benchmark
        run: |
          k6 run benchmarks/k6/with-agent.js \
            --env BASE_URL=http://127.0.0.1:3000

      - name: Compare P99 — fail if overhead > 5%
        run: node benchmarks/compare-p99.js \
          benchmarks/output/baseline.json \
          benchmarks/output/with-agent.json

      - name: Update committed baseline
        run: node benchmarks/update-baseline.js

      - name: Commit updated baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/baselines/p99-baseline.json
          git diff --staged --quiet || \
            git commit -m "chore: update p99 baseline [skip ci]" && \
            git push

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/output/

  multi-os:
    name: "Multi-OS (${{ matrix.image }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        image:
          - node:22-alpine
          - node:22-bookworm
          - node:20-alpine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test on ${{ matrix.image }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            ${{ matrix.image }} \
            sh -c "npm ci && npm run typecheck && npm run test:unit && npm run test:lab"

  compat-apm:
    name: "APM Compatibility"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies (including compat devDeps)
        run: npm ci

      - name: Run APM compatibility tests
        run: npm run test:compat
        env:
          NODE_ENV: test
