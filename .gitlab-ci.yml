# @queno/agent-node — GitLab CI Pipeline
#
# Tag vX.Y.Z : build + verify + SBOM (E.1.3) + npm publish
#
# CI variables (Protected + Masked, scope tags v*):
#   NPM_TOKEN — npm publish

# Shell executor on oriso-runner-01 — `image:` ignored; Node required on host.

image: node:22-alpine@sha256:ab07539e0988b63558ff621f5fbe1077054c39d9809112974fb79993949d41cd

stages:
  - test
  - compat
  - benchmark
  - security
  - build
  - verify
  - sbom
  - publish

default:
  tags:
    - oriso-runner-01
  before_script:
    - node --version
    - npm --version

.only_mr_and_main: &only_mr_and_main
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'

.only_tag: &only_tag
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'

test:
  stage: test
  <<: *only_mr_and_main
  variables:
    NODE_ENV: test
  script:
    - npm ci
    - npm run typecheck
    - npm run test:unit
    - npm run test:lab
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/

conflict-test:
  stage: compat
  <<: *only_mr_and_main
  allow_failure: false
  script:
    - npm ci
    - npm run test:compat
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  artifacts:
    when: always
    paths:
      - test-lab/compat/CONFLICTS.md
    expire_in: 30 days

benchmark:
  stage: benchmark
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - apk add --no-cache curl bash
    - curl -fsSL https://github.com/grafana/k6/releases/download/v0.55.0/k6-v0.55.0-linux-amd64.tar.gz | tar -xz --strip-components=1 -C /usr/local/bin
    - npm ci
    - cd examples/banking-api && npm ci && cd ../..
    - >
      NODE_ENV=test RASP_MODE=monitor PORT=3000
      node --import tsx/esm examples/banking-api/src/server.ts &
    - sleep 5
    - mkdir -p benchmarks/output
    - k6 run benchmarks/k6/with-agent.js --env BASE_URL=http://127.0.0.1:3000
    - node benchmarks/compare-p99.js benchmarks/baselines/p99-baseline.json benchmarks/output/with-agent.json
  artifacts:
    when: always
    paths:
      - benchmarks/output/
    expire_in: 7 days

security-audit:
  stage: security
  <<: *only_mr_and_main
  allow_failure: true
  script:
    - npm ci
    - npm audit --omit=dev --audit-level=high
    - |
      echo "=== Dev dependency audit (informational) ==="
      npm audit --audit-level=high || true

.build_template: &build_template
  stage: build
  <<: *only_tag
  variables:
    SOURCE_DATE_EPOCH: "0"
  script:
    - npm ci
    - SOURCE_DATE_EPOCH=0 NODE_ENV=production npm run build
    - find dist -type f | sort | xargs sha256sum > "${CI_JOB_NAME}.sha256"
    - echo "=== Build hash manifest (${CI_JOB_NAME}) ==="
    - cat "${CI_JOB_NAME}.sha256"
  artifacts:
    paths:
      - dist/
      - "${CI_JOB_NAME}.sha256"
    expire_in: 1 hour

build-1:
  <<: *build_template

build-2:
  <<: *build_template

verify-hashes:
  stage: verify
  <<: *only_tag
  needs:
    - job: build-1
      artifacts: true
    - job: build-2
      artifacts: true
  script:
    - |
      echo "Comparing build-1 and build-2 hash manifests..."
      if ! diff <(sort build-1.sha256) <(sort build-2.sha256); then
        echo "ERROR - builds are NOT reproducible — hashes diverge. Blocking release."
        exit 1
      fi
      echo "OK - builds are reproducible."
  artifacts:
    paths:
      - dist/
      - build-1.sha256
    expire_in: 1 hour

# E.1.3 — SBOM CycloneDX + SPDX (production deps), then npm pack.

sbom:
  stage: sbom
  <<: *only_tag
  needs:
    - job: verify-hashes
      artifacts: true
  script:
    - npm ci
    - npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-file sbom.cdx.json --output-format JSON
    - npm sbom --omit dev --sbom-format spdx > sbom.spdx.json
    - |
      echo "=== SBOM summary ==="
      node -e "const s=require('./sbom.cdx.json'); console.log('CycloneDX components:', (s.components||[]).length)"
      wc -c sbom.cdx.json sbom.spdx.json
    - npm pack
    - |
      TARBALL=$(ls *.tgz)
      echo "Packed ${TARBALL}"
  artifacts:
    paths:
      - "*.tgz"
      - sbom.cdx.json
      - sbom.spdx.json
    expire_in: 365 days

# Publishing is MANUALLY triggered and gated by the `npm-production` protected
# environment (Addendum E.3.2). Configure the environment in GitLab with
# required approvers (minimum 2) before the job can run. The NPM_TOKEN is
# scoped to the `npm-production` environment only — it is not available to
# any other job.
publish:
  stage: publish
  <<: *only_tag
  when: manual
  environment:
    name: npm-production
    # Deploy URL shown in the GitLab UI release panel.
    url: https://www.npmjs.com/package/@queno/agent-node/v/${CI_COMMIT_TAG}
  needs:
    - job: sbom
      artifacts: true
  script:
    - |
      printf '%s\n' "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    - TARBALL=$(ls *.tgz)
    - npm publish "${TARBALL}" --access public
    - rm -f .npmrc
    - |
      curl --fail --silent --show-error \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "{
          \"name\": \"${CI_COMMIT_TAG}\",
          \"tag_name\": \"${CI_COMMIT_TAG}\",
          \"description\": \"Release ${CI_COMMIT_TAG}\",
          \"ref\": \"${CI_COMMIT_SHA}\"
        }" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases" || true
    - echo "Published @queno/agent-node@${CI_COMMIT_TAG} to npm"
  artifacts:
    paths:
      - sbom.cdx.json
      - sbom.spdx.json
    expire_in: 365 days
