# @queno/agent-node — GitLab CI Pipeline
#
# Triggers:
#   - MR / push to main : test + benchmark (on MR) + security scan
#   - Tag vX.Y.Z        : all of the above + double build + verify hashes + sign + npm publish
#
# Variables to configure in GitLab (Settings > CI/CD > Variables):
#   NPM_TOKEN   — npm automation token, Protected + Masked, scoped to protected tags v*

# Pinned digest — regenerate with:
#   docker pull node:22-alpine && docker inspect node:22-alpine --format '{{index .RepoDigests 0}}'
image: node:22-alpine@sha256:ab07539e0988b63558ff621f5fbe1077054c39d9809112974fb79993949d41cd

stages:
  - test
  - benchmark
  - security
  - build
  - verify
  - sign
  - publish

# ─── Shared defaults ──────────────────────────────────────────────────────────

default:
  before_script:
    - node --version
    - npm --version

.only_mr_and_main: &only_mr_and_main
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'

.only_tag: &only_tag
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'

# ─── Stage: test ──────────────────────────────────────────────────────────────

test:
  stage: test
  <<: *only_mr_and_main
  variables:
    NODE_ENV: test
  script:
    - npm ci
    - npm run typecheck
    - npm run test:unit
    - npm run test:lab
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/

# ─── Stage: benchmark ─────────────────────────────────────────────────────────
# Runs only on MRs to gate performance regressions before merge.

benchmark:
  stage: benchmark
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    # Install k6
    - apk add --no-cache curl bash
    - curl -fsSL https://github.com/grafana/k6/releases/download/v0.55.0/k6-v0.55.0-linux-amd64.tar.gz | tar -xz --strip-components=1 -C /usr/local/bin
    - npm ci
    # Build the example banking-api
    - cd examples/banking-api && npm ci && cd ../..
    # Start server with agent on port 3000
    - >
      NODE_ENV=test RASP_MODE=monitor PORT=3000
      node --import tsx/esm examples/banking-api/src/server.ts &
    - sleep 5
    # Run k6 and compare against committed baseline (fails if P99 overhead > 5%)
    - mkdir -p benchmarks/output
    - k6 run benchmarks/k6/with-agent.js --env BASE_URL=http://127.0.0.1:3000
    - node benchmarks/compare-p99.js benchmarks/baselines/p99-baseline.json benchmarks/output/with-agent.json
  artifacts:
    when: always
    paths:
      - benchmarks/output/
    expire_in: 7 days

# ─── Stage: security ──────────────────────────────────────────────────────────

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

# Restrict security jobs to MR + main (same as test)
sast:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'

dependency_scanning:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'

secret_detection:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'

# ─── Stage: build (x2 — reproducibility check) ───────────────────────────────
# Both jobs run in parallel on the same pinned image with SOURCE_DATE_EPOCH=0
# to ensure the TypeScript compiler produces byte-identical output.
# If hashes diverge, the release is blocked in the verify stage.

.build_template: &build_template
  stage: build
  <<: *only_tag
  variables:
    # Zero epoch makes any tool that embeds timestamps deterministic.
    SOURCE_DATE_EPOCH: "0"
    NODE_ENV: production
  script:
    - npm ci
    - npm run build
    # Hash every file in dist/ and write a sorted manifest
    - find dist -type f | sort | xargs sha256sum > build.sha256
    - echo "=== Build hash manifest ==="
    - cat build.sha256
  artifacts:
    paths:
      - dist/
      - build.sha256
    expire_in: 1 hour

build-1:
  <<: *build_template

build-2:
  <<: *build_template

# ─── Stage: verify ────────────────────────────────────────────────────────────

verify-hashes:
  stage: verify
  <<: *only_tag
  needs:
    - job: build-1
      artifacts: true
    - job: build-2
      artifacts: true
  script:
    - echo "Comparing build-1 and build-2 hash manifests..."
    - mv build.sha256 build-2.sha256
    # build-1 artifact overwrites — we need both; use CI_JOB_NAME to distinguish
    # Both artifacts are downloaded into the same workspace; compare via diff
    - |
      if ! diff <(sort build-1.sha256 2>/dev/null || sort build.sha256) <(sort build-2.sha256); then
        echo "ERROR: builds are NOT reproducible — hashes diverge. Blocking release."
        exit 1
      fi
    - echo "OK: builds are reproducible."
  # Pass dist/ to the next stages
  artifacts:
    paths:
      - dist/
      - build.sha256
    expire_in: 1 hour

# ─── Stage: sign ──────────────────────────────────────────────────────────────
# Keyless signing via Sigstore + GitLab OIDC — no private key stored anywhere.
# The OIDC token proves the artifact was built by this specific pipeline/commit.

sign:
  stage: sign
  <<: *only_tag
  needs:
    - job: verify-hashes
      artifacts: true
  # GitLab OIDC token for Sigstore keyless signing
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - apk add --no-cache curl
    # Install cosign
    - >
      curl -fsSL
      https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
      -o /usr/local/bin/cosign && chmod +x /usr/local/bin/cosign
    # Generate SBOM (CycloneDX) from installed dependencies
    - npm ci
    - npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json --output-format JSON
    # Pack the tarball (same as what npm publish will produce)
    - npm pack
    - TARBALL=$(ls *.tgz)
    # Sign the tarball — keyless, ephemeral cert tied to this pipeline identity
    - cosign sign-blob --yes --bundle "${TARBALL}.bundle" "${TARBALL}"
    # Attest the SBOM against the tarball
    - cosign attest-blob --yes --bundle sbom.bundle --predicate sbom.cdx.json --type cyclonedx "${TARBALL}"
    - echo "Signed tarball ${TARBALL}"
  artifacts:
    paths:
      - "*.tgz"
      - "*.bundle"
      - sbom.cdx.json
    expire_in: 7 days

# ─── Stage: publish ───────────────────────────────────────────────────────────
# npm publish --provenance sends a Sigstore SLSA provenance attestation to
# the npm registry automatically, verifiable via: npm audit signatures @queno/agent-node
#
# Requires: NPM_TOKEN (Protected + Masked variable, scoped to protected tags v*)

publish:
  stage: publish
  <<: *only_tag
  needs:
    - job: sign
      artifacts: true
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    # Configure npm auth
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    # Publish with provenance (SLSA attestation via Sigstore OIDC)
    - npm publish --provenance --access public
    # Create a GitLab Release with the SBOM attached
    - >
      curl --fail --silent --show-error
      --header "PRIVATE-TOKEN: ${CI_JOB_TOKEN}"
      --header "Content-Type: application/json"
      --data "{
        \"name\": \"${CI_COMMIT_TAG}\",
        \"tag_name\": \"${CI_COMMIT_TAG}\",
        \"description\": \"Release ${CI_COMMIT_TAG}\",
        \"ref\": \"${CI_COMMIT_SHA}\"
      }"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases" || true
    - echo "Published @queno/agent-node@${CI_COMMIT_TAG} to npm"
  artifacts:
    paths:
      - sbom.cdx.json
    expire_in: 365 days
